services:
  - type: web
    name: echo-music-bot-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_REDIRECT_URI
        sync: false
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: EMOJI_AUTO_UPLOAD
        value: "false"
